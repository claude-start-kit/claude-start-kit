<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Malgun Gothic','Pretendard',sans-serif">
  <rect width="760" height="280" rx="16" fill="#151922"/>
  <text x="24" y="38" fill="#ff8a5c" font-size="15" font-weight="700">처음엔 이 5개면 충분합니다</text>
  <g font-size="14">
    <rect x="24" y="56" width="340" height="60" rx="12" fill="#222838" stroke="#343c52"/>
    <text x="44" y="82" fill="#ffd9c8" font-family="Consolas,monospace" font-size="16">claude</text><text x="44" y="102" fill="#8b93a7" font-size="13">현재 폴더에서 Claude Code 시작</text>

    <rect x="396" y="56" width="340" height="60" rx="12" fill="#222838" stroke="#343c52"/>
    <text x="416" y="82" fill="#ffd9c8" font-family="Consolas,monospace" font-size="16">/help</text><text x="416" y="102" fill="#8b93a7" font-size="13">사용 가능한 명령 목록 보기</text>

    <rect x="24" y="130" width="340" height="60" rx="12" fill="#222838" stroke="#343c52"/>
    <text x="44" y="156" fill="#ffd9c8" font-family="Consolas,monospace" font-size="16">/clear</text><text x="44" y="176" fill="#8b93a7" font-size="13">새 대화로 시작 (주제가 바뀔 때)</text>

    <rect x="396" y="130" width="340" height="60" rx="12" fill="#222838" stroke="#343c52"/>
    <text x="416" y="156" fill="#ffd9c8" font-family="Consolas,monospace" font-size="16">/resume</text><text x="416" y="176" fill="#8b93a7" font-size="13">이전 대화 이어가기</text>

    <rect x="24" y="204" width="712" height="56" rx="12" fill="#2b1f1a" stroke="#ff8a5c"/>
    <text x="44" y="229" fill="#ffd9c8" font-family="Consolas,monospace" font-size="16">/exit</text><text x="44" y="249" fill="#c9a18d" font-size="13">종료 (Ctrl+D 를 두 번 눌러도 됩니다)</text>
  </g>
</svg>
