<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Malgun Gothic','Pretendard',sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a5c"/></marker>
  </defs>
  <rect width="760" height="280" rx="16" fill="#151922"/>
  <g font-size="14" text-anchor="middle">
    <rect x="24" y="60" width="150" height="100" rx="14" fill="#2b1f1a" stroke="#ff8a5c"/>
    <text x="99" y="96" fill="#ffd9c8" font-weight="700">① 진입</text><text x="99" y="120" fill="#c9a18d" font-size="12">Shift+Tab 또는</text><text x="99" y="138" fill="#c9a18d" font-size="12" font-family="Consolas,monospace">/plan 설명</text>

    <rect x="210" y="60" width="150" height="100" rx="14" fill="#222838" stroke="#343c52"/>
    <text x="285" y="96" fill="#e6e9f2" font-weight="700">② 읽기만</text><text x="285" y="120" fill="#8b93a7" font-size="12">파일 탐색 · 조사</text><text x="285" y="138" fill="#8b93a7" font-size="12">수정은 막혀 있음</text>

    <rect x="396" y="60" width="150" height="100" rx="14" fill="#222838" stroke="#343c52"/>
    <text x="471" y="96" fill="#e6e9f2" font-weight="700">③ 계획서</text><text x="471" y="120" fill="#8b93a7" font-size="12">내가 읽고</text><text x="471" y="138" fill="#8b93a7" font-size="12">Ctrl+G 로 수정 가능</text>

    <rect x="582" y="60" width="154" height="100" rx="14" fill="#14281d" stroke="#4ade80"/>
    <text x="659" y="96" fill="#bdf5d0" font-weight="700">④ 승인 후 실행</text><text x="659" y="120" fill="#7fbf98" font-size="12">Yes → 수정 시작</text><text x="659" y="138" fill="#7fbf98" font-size="12">No → 계속 계획</text>
  </g>
  <path d="M176 110H208" stroke="#ff8a5c" stroke-width="2" marker-end="url(#o)"/>
  <path d="M362 110H394" stroke="#ff8a5c" stroke-width="2" marker-end="url(#o)"/>
  <path d="M548 110H580" stroke="#ff8a5c" stroke-width="2" marker-end="url(#o)"/>
  <text x="380" y="214" fill="#e6e9f2" font-size="14" text-anchor="middle">언제 쓰나요?  <tspan fill="#8b93a7">큰 변경 · 처음 보는 코드 · 방향이 애매할 때</tspan></text>
  <text x="380" y="240" fill="#8b93a7" font-size="13" text-anchor="middle">"고치기 전에 먼저 이해하고 계획한다" — 실수를 가장 싸게 막는 방법</text>
</svg>
