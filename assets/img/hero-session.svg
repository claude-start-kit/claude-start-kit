<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Malgun Gothic','Pretendard',sans-serif">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity=".25"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <ellipse cx="300" cy="200" rx="230" ry="150" fill="url(#glow)" filter="url(#blur)"/>

  <!-- 터미널 창 -->
  <rect x="30" y="34" width="520" height="300" rx="16" fill="#0b0e14" stroke="#343c52"/>
  <rect x="30" y="34" width="520" height="38" rx="16" fill="#1b2130"/>
  <rect x="30" y="56" width="520" height="16" fill="#1b2130"/>
  <rect x="46" y="47" width="14" height="12" rx="2" fill="#2f3a52" stroke="#8b93a7"/><text x="48" y="57" fill="#c9d1e3" font-size="9" font-family="Consolas,monospace" font-weight="700">&gt;_</text>
  <text x="70" y="58" fill="#c9d1e3" font-size="13">test-project — claude</text>
  <g stroke="#c9d1e3" stroke-width="1.3" fill="none"><path d="M458 53H468"/><rect x="490" y="48" width="9" height="9"/><path d="M518 48L527 57M527 48L518 57"/></g>

  <g font-size="15">
    <!-- 요청 -->
    <rect x="52" y="92" width="476" height="46" rx="10" fill="#1b2130" stroke="#2b3246"/>
    <text x="68" y="121" fill="#ff8a5c" font-family="Consolas,monospace" font-weight="700">&gt;</text>
    <text x="90" y="121" fill="#f1f3fa">이번 주 회의록을 표로 정리해 줘</text>

    <!-- 진행 -->
    <circle cx="66" cy="168" r="5" fill="#7ee2a8"/>
    <text x="84" y="173" fill="#c9d1e3">meeting.txt 읽는 중</text>
    <text x="500" y="173" fill="#7ee2a8" font-size="13" text-anchor="end">완료</text>

    <circle cx="66" cy="204" r="5" fill="#7ee2a8"/>
    <text x="84" y="209" fill="#c9d1e3">summary.md 작성</text>
    <text x="500" y="209" fill="#7ee2a8" font-size="13" text-anchor="end">완료</text>

    <circle cx="66" cy="240" r="5" fill="#fde68a"/>
    <text x="84" y="245" fill="#c9d1e3">원문과 대조해 확인하는 중…</text>
    <rect x="300" y="229" width="9" height="19" fill="#ff8a5c"/>
  </g>

  <!-- 결과 표 -->
  <rect x="52" y="268" width="476" height="50" rx="10" fill="#14281d" stroke="#2f6b47"/>
  <g font-size="13" fill="#bdf5d0">
    <text x="68" y="290" font-weight="700">결정사항</text><text x="250" y="290" font-weight="700">담당자</text><text x="360" y="290" font-weight="700">마감일</text>
    <text x="68" y="309">견적서 초안 발송</text><text x="250" y="309">김대리</text><text x="360" y="309">12/1</text>
  </g>

  <!-- 장식 뱃지 -->
  <g>
    <rect x="410" y="12" width="150" height="34" rx="17" fill="#2b1f1a" stroke="#ff8a5c"/>
    <text x="485" y="34" fill="#ffd9c8" font-size="13" font-weight="700" text-anchor="middle">말로 시키면 끝</text>
  </g>
  <text x="290" y="362" fill="#8b93a7" font-size="12" text-anchor="middle">예시 화면 — 실제 결과는 요청과 환경에 따라 다릅니다</text>
</svg>
