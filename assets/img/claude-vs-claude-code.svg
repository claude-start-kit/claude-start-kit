<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Malgun Gothic','Pretendard',sans-serif">
  <rect width="760" height="360" rx="16" fill="#151922"/>

  <!-- Claude (웹·앱) -->
  <text x="190" y="40" text-anchor="middle" fill="#8b93a7" font-size="17" font-weight="700">Claude (웹·앱 채팅)</text>
  <rect x="30" y="58" width="320" height="86" rx="12" fill="#222838" stroke="#343c52"/>
  <text x="46" y="86" fill="#e6e9f2" font-size="14" font-weight="700">💬 대화로 답을 받습니다</text>
  <text x="46" y="110" fill="#c3c9d9" font-size="13.5">질문 · 글쓰기 · 요약 · 아이디어</text>
  <text x="46" y="130" fill="#c3c9d9" font-size="13.5">결과를 내가 복사해서 옮깁니다</text>
  <rect x="30" y="158" width="320" height="86" rx="12" fill="#222838" stroke="#343c52"/>
  <text x="46" y="186" fill="#e6e9f2" font-size="14" font-weight="700">📎 내가 파일을 올려 줍니다</text>
  <text x="46" y="210" fill="#c3c9d9" font-size="13.5">필요한 자료를 그때그때 첨부</text>
  <rect x="30" y="258" width="320" height="72" rx="12" fill="#222838" stroke="#343c52"/>
  <text x="46" y="286" fill="#e6e9f2" font-size="14" font-weight="700">🌐 브라우저·앱에서 사용</text>
  <text x="46" y="310" fill="#c3c9d9" font-size="13.5">설치 없이 바로 시작</text>

  <!-- Claude Code -->
  <text x="570" y="40" text-anchor="middle" fill="#ff8a5c" font-size="17" font-weight="700">Claude Code</text>
  <rect x="410" y="58" width="320" height="86" rx="12" fill="#2a2320" stroke="#ff8a5c" stroke-width="1.5"/>
  <text x="426" y="86" fill="#e6e9f2" font-size="14" font-weight="700">🛠 직접 일을 끝냅니다</text>
  <text x="426" y="110" fill="#e6e9f2" font-size="13.5">파일을 고치고 · 실행하고 · 확인까지</text>
  <text x="426" y="130" fill="#e6e9f2" font-size="13.5">바꾸기 전에 내 확인을 받습니다</text>
  <rect x="410" y="158" width="320" height="86" rx="12" fill="#2a2320" stroke="#ff8a5c" stroke-width="1.5"/>
  <text x="426" y="186" fill="#e6e9f2" font-size="14" font-weight="700">📂 내 폴더를 직접 읽습니다</text>
  <text x="426" y="210" fill="#e6e9f2" font-size="13.5">작업 폴더의 파일을 필요한 만큼 스스로 확인</text>
  <rect x="410" y="258" width="320" height="72" rx="12" fill="#2a2320" stroke="#ff8a5c" stroke-width="1.5"/>
  <text x="426" y="286" fill="#e6e9f2" font-size="14" font-weight="700">⌨ 터미널 · IDE · 데스크톱 앱 Code 탭</text>
  <text x="426" y="310" fill="#e6e9f2" font-size="13.5">유료 구독(Pro 이상) 로그인 필요</text>

  <!-- 가운데 -->
  <text x="380" y="190" text-anchor="middle" fill="#8b93a7" font-size="22">vs</text>
</svg>
